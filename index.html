        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="960" height="540">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>
        <script type="text/javascript">
            (function () {
                var canvas = document.getElementById("canvas");
                var iniciado = false;
                var pendiente = null;

                function ajustar() {
                    var vv = window.visualViewport;
                    var w = Math.floor(vv ? vv.width : document.documentElement.clientWidth);
                    var h = Math.floor(vv ? vv.height : document.documentElement.clientHeight);
                    if (w < 1 || h < 1) return;
                    var cw = Math.min(960, w);
                    var ch = Math.floor(cw * 9 / 16);
                    if (ch > h) {
                        ch = Math.min(540, h);
                        cw = Math.floor(ch * 16 / 9);
                    }
                    canvas.style.setProperty("width", cw + "px", "important");
                    canvas.style.setProperty("height", ch + "px", "important");
                }

                function avisar() {
                    if (!iniciado) return;
                    try {
                        window.dispatchEvent(new Event("resize"));
                    } catch (err) {}
                }

                function programar() {
                    ajustar();
                    clearTimeout(pendiente);
                    pendiente = setTimeout(avisar, 200);
                }

                ajustar();

                window.addEventListener("resize", function (e) {
                    if (e.isTrusted) programar();
                });
                window.addEventListener("orientationchange", function () {
                    programar();
                    setTimeout(programar, 500);
                });
                if (window.visualViewport) {
                    window.visualViewport.addEventListener("resize", programar);
                }

                document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
                document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
                document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

                window.arrancarNeon = function () {
                    GameMaker_Init();
                    iniciado = true;
                    setTimeout(function () { ajustar(); avisar(); }, 600);
                    setTimeout(function () { ajustar(); avisar(); }, 1500);
                };
            })();
        </script>
