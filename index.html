<!DOCTYPE html>
<html lang="es">
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>
        <meta http-equiv="pragma" content="no-cache"/>
        <title>NeonSurvivor</title>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                border: 0;
                overflow: hidden;
                background: #000000;
                color: #cccccc;
                overscroll-behavior: none;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            #gm4html5_div_id {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
            }
            #canvas {
                display: block;
                flex: none;
                margin: 0;
                padding: 0;
                border: 0;
                touch-action: none;
                -ms-touch-action: none;
                outline: none;
            }
        </style>
    </head>
    <body>
        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="960" height="540">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>
        <script type="text/javascript">
            (function () {
                var canvas = document.getElementById("canvas");

                function ajustar() {
                    var vv = window.visualViewport;
                    var w = Math.floor(vv ? vv.width : document.documentElement.clientWidth);
                    var h = Math.floor(vv ? vv.height : document.documentElement.clientHeight);
                    if (w < 1 || h < 1) return;
                    var cw = w;
                    var ch = Math.floor(w * 9 / 16);
                    if (ch > h) {
                        ch = h;
                        cw = Math.floor(h * 16 / 9);
                    }
                    canvas.style.setProperty("width", cw + "px", "important");
                    canvas.style.setProperty("height", ch + "px", "important");
                }

                function ajustarYAvisar() {
                    ajustar();
                    window.dispatchEvent(new Event("resize"));
                }

                ajustar();

                window.addEventListener("load", function () {
                    ajustarYAvisar();
                    setTimeout(ajustarYAvisar, 300);
                    setTimeout(ajustarYAvisar, 1000);
                });

                var pendiente = null;
                function programar() {
                    ajustar();
                    clearTimeout(pendiente);
                    pendiente = setTimeout(ajustarYAvisar, 150);
                }
