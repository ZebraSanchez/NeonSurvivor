<!DOCTYPE html>
<html lang="es">
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>
        <meta http-equiv="pragma" content="no-cache"/>
        <title>NeonSurvivor</title>

        <style>
            html, body {
                background-color: #000000;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                touch-action: none;
            }
            #gm4html5_div_id {
                position: fixed;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                touch-action: none;
            }
            canvas {
                touch-action: none;
                image-rendering: optimizeSpeed;
            }
        </style>
    </head>

    <body>
        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="960" height="540">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>

        <script type="text/javascript" src="html5game/BarberoGarcíaMario_Juego_AppsWeb_SinMejoras.js?cachebust=1923245633"></script>
        <script>
            window.onload = function() {
                GameMaker_Init();
                function ajustarPantalla() {
                    var c = document.getElementById("canvas");
                    if (!c) return;
                    var w = window.innerWidth;
                    var h = window.innerHeight;
                    var scale = Math.min(w / c.width, h / c.height);
                    c.style.position = "fixed";
                    c.style.left = "50%";
                    c.style.top = "50%";
                    c.style.transformOrigin = "center center";
                    c.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
                }
                setInterval(ajustarPantalla, 250);
                window.addEventListener("resize", ajustarPantalla);
                ajustarPantalla();
            };
        </script>
    </body>
</html>
