        <script type="text/javascript">
            (function () {
                var FW = 960;
                var FH = 540;

                function medir() {
                    var vv = window.visualViewport;
                    var de = document.documentElement;
                    var w = Math.floor(vv ? vv.width : de.clientWidth);
                    var h = Math.floor(vv ? vv.height : de.clientHeight);
                    if (w < 1 || h < 1) return;
                    if (w / h > 16 / 9) {
                        FH = h;
                        FW = Math.floor(h * 16 / 9);
                    } else {
                        FW = w;
                        FH = Math.floor(w * 9 / 16);
                    }
                }

                medir();

                Object.defineProperty(window, "innerWidth", { get: function () { return FW; }, configurable: true });
                Object.defineProperty(window, "innerHeight", { get: function () { return FH; }, configurable: true });

                function refrescar() {
                    medir();
                    setTimeout(function () {
                        medir();
                        window.dispatchEvent(new Event("resize"));
                    }, 200);
                }

                window.addEventListener("resize", medir);
                window.addEventListener("orientationchange", refrescar);
                if (window.visualViewport) {
                    window.visualViewport.addEventListener("resize", medir);
                }

                document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
                document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
                document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
            })();
        </script>
